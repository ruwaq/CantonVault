version: 2
updates:
  # Backend (Gradle)
  - package-ecosystem: "gradle"
    directory: "/cn-quickstart/quickstart"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"

  # Frontend (npm)
  - package-ecosystem: "npm"
    directory: "/cn-quickstart/quickstart/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"

  # CLI (npm) — audit Fase 3, M-3: previously uncovered, so no CVE alerts.
  - package-ecosystem: "npm"
    directory: "/cli"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "cli"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"

  # Docker images (base images, build-stage images like jwt-cli)
  - package-ecosystem: "docker"
    directory: "/cn-quickstart/quickstart"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
